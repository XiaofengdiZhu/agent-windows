[project]
name = "agent-windows"
version = "0.1.0"
description = "Windows Computer-Use CLI for AI Agents"
readme = "README.md"
authors = [
    { name = "销锋镝铸", email = "523084467@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
    "comtypes>=1.4",
    "pywin32>=306",
    "Pillow>=10.0",
    "mss>=10.0",
    "openai>=1.0",
    "toml>=0.10",
]

[project.optional-dependencies]
dxcam = ["dxcam>=0.3"]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
agent-windows = "agent_windows.cli.main:app"

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
