[project]
name = "agent-windows"
version = "0.1.0"
description = "Windows Computer-Use CLI for AI Agents"
readme = "README.md"
license = "MIT"
authors = [
    { name = "销锋镝铸", email = "523084467@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
    "comtypes>=1.4",
    "pywin32>=306",
    "Pillow>=10.0",
    "mss>=10.0",
    "openai>=1.0",
    "toml>=0.10",
]

[project.optional-dependencies]
dxcam = ["dxcam>=0.3"]
anthropic = ["anthropic>=0.40"]
gemini = ["google-generativeai>=0.7"]
# numpy speeds up the `diff` screenshot command (falls back to a slow path if absent)
diff = ["numpy>=1.26"]
dev = ["pytest>=8.0"]

[project.scripts]
# The native Rust launcher ships as a prebuilt `agent-windows.exe` (see
# [tool.uv.build-backend] below) and lands in Scripts/ on install — that's the
# fast (~15ms) entry point users get. This Python entry is the fallback for
# --no-daemon mode and commands not yet ported to the launcher.
agent-windows-python = "agent_windows.cli.main:app"

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

# Ship the prebuilt native launcher so `uv tool install` / `uvx` puts the fast
# Rust binary on PATH. The .exe lives in wheel's {name}-{version}.data/scripts/
# which pip/uv extracts into the install prefix's Scripts/ dir.
[tool.uv.build-backend.data]
scripts = "src/launcher/prebuilt"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end daemon smoke test (opt-in via AGENT_WINDOWS_E2E=1)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
