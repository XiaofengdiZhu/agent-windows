[project]
name = "agent-windows"
version = "0.1.0"
description = "Windows Computer-Use CLI for AI Agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/agent_windows/uia/LICENSE-APACHE.txt"]
authors = [
    { name = "销锋镝铸", email = "523084467@qq.com" }
]
requires-python = ">=3.13"
keywords = [
    "windows",
    "automation",
    "agent",
    "uia",
    "accessibility",
    "test-automation",
    "desktop-automation",
    "computer-automation",
    "computer-use",
    "computer-use-agent",
    "ai-agents",
    "ai-tools",
    "testing-tools",
    "cli",
    "rpa",
    "end-to-end-testing",
    "e2e-testing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Operating System",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "comtypes>=1.4",
    "pywin32>=306",
    "Pillow>=10.0",
    "mss>=10.0",
    "openai>=1.0",
    "toml>=0.10",
]

[project.urls]
Homepage = "https://github.com/XiaofengdiZhu/agent-windows"
Repository = "https://github.com/XiaofengdiZhu/agent-windows"
Issues = "https://github.com/XiaofengdiZhu/agent-windows/issues"
Changelog = "https://github.com/XiaofengdiZhu/agent-windows/releases"

[project.optional-dependencies]
dxcam = ["dxcam>=0.3"]
anthropic = ["anthropic>=0.40"]
gemini = ["google-generativeai>=0.7"]
# numpy speeds up the `diff` screenshot command (falls back to a slow path if absent)
diff = ["numpy>=1.26"]
# MCP server: exposes every command as MCP tools via FastMCP (see docs/MCP-support.md)
mcp = ["fastmcp>=3.0"]
dev = ["pytest>=9.0.3"]

[project.scripts]
# The native Rust launcher is built from source (build.cmd locally, or
# `cargo build --release` in CI) and staged into src/launcher/prebuilt/ before
# the wheel is packaged (see [tool.uv.build-backend] below). It lands in
# Scripts/ on install as the fast (~15ms) entry point. This Python entry is the
# fallback for --no-daemon mode and commands not yet ported to the launcher.
agent-windows-python = "agent_windows.cli.main:main"

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

# The native launcher exe is staged into src/launcher/prebuilt/ by build.cmd
# (local) or cargo (CI) before packaging — it is NOT committed to the repo
# (prebuilt/*.exe is gitignored). uv_build copies this dir's contents into the
# wheel's {name}-{version}.data/scripts/, which pip/uv extract into the install
# prefix's Scripts/ dir so `uv tool install` / `uvx` put the fast Rust binary on
# PATH. An empty/missing prebuilt/ at build time yields a wheel without the exe
# (the Python entry point still works) — run build.cmd first to include it.
[tool.uv.build-backend.data]
scripts = "src/launcher/prebuilt"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end daemon smoke test (opt-in via AGENT_WINDOWS_E2E=1)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
