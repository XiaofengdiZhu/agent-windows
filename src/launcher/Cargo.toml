[package]
name = "agent-windows-launcher"
version = "0.1.0"
edition = "2021"
description = "Native launcher (command forwarder) for agent-windows — parses CLI args and forwards to the daemon over named pipe."

[[bin]]
name = "agent-windows"
path = "src/main.rs"

[profile.release]
opt-level = "z"      # optimize for size
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
